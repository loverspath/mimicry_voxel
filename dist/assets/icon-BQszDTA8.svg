<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9f1239" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" stroke="#f43f5e" stroke-width="6" stroke-opacity="0.3" />
  
  <!-- 3D Voxel Isometric Cube -->
  <g transform="translate(256, 260) scale(1.15)">
    <!-- Top Face -->
    <polygon points="0,-90 120,-30 0,30 -120,-30" fill="url(#cubeTop)" />
    <!-- Left Face -->
    <polygon points="-120,-30 0,30 0,140 -120,80" fill="url(#cubeLeft)" />
    <!-- Right Face -->
    <polygon points="0,30 120,-30 120,80 0,140" fill="url(#cubeRight)" />
    <!-- Cube Edge Highlight -->
    <polyline points="-120,-30 0,-90 120,-30" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="3" />
    <polyline points="0,30 0,140" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="3" />
    
    <!-- Chromatic ASCII @ Symbol -->
    <!-- Cyan Shift -->
    <text x="-4" y="-30" font-family="Consolas, monospace" font-size="96" font-weight="900" fill="#38bdf8" text-anchor="middle" dominant-baseline="central" opacity="0.8" filter="url(#glow)">@</text>
    <!-- Magenta Shift -->
    <text x="4" y="-30" font-family="Consolas, monospace" font-size="96" font-weight="900" fill="#f43f5e" text-anchor="middle" dominant-baseline="central" opacity="0.8" filter="url(#glow)">@</text>
    <!-- Main Gold Glyph -->
    <text x="0" y="-30" font-family="Consolas, monospace" font-size="96" font-weight="900" fill="#ffd700" text-anchor="middle" dominant-baseline="central">@</text>
  </g>
</svg>
